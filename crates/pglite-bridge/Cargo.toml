[package]
name = "pglite-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wasm32 cdylib boundary between the JS adapter and pglite core crates"

[lib]
crate-type = ["cdylib"]

[dependencies]
pglite-core = { path = "../pglite-core" }
pglite-protocol = { path = "../pglite-protocol" }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
